[project]
name = "fast2pg"
version = "0.1.0"
description = "A tiny FastHTML app that stores strings in Postgres"
readme = "README.md"
authors = [
    { name = "Eddy Shoemaker", email = "bulkware@posteo.org" }
]
requires-python = ">=3.15"
dependencies = [
    "psycopg[binary,pool]>=3.3.6",
    "python-fasthtml>=0.14.16",
]

[project.scripts]
fast2pg = "fast2pg:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
